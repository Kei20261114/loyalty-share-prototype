function translateAll(){const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){const t=trS(n.nodeValue);if(t!==n.nodeValue)n.nodeValue=t;}
 document.querySelectorAll('input,textarea').forEach(e=>{if(e.placeholder){const t=trS(e.placeholder);if(t!==e.placeholder)e.placeholder=t;}if(e.value&&/[一-鿿]/.test(e.value))e.value=trS(e.value);});
 document.querySelectorAll('option').forEach(o=>{const t=trS(o.textContent);if(t!==o.textContent)o.textContent=t;});};
